name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Patch web for old WebView (auto-fix "tap Start no response")
        run: |
          python3 - <<'PY'
          import os
          p = 'www/index.html'
          s = open(p, encoding='utf-8').read()
          poly = ('<script>if(!Array.prototype.flat){Array.prototype.flat=function(d){'
                  'd=typeof d==="undefined"?1:d;var r=[];(function f(a,n){a.forEach(function(x){'
                  'if(Array.isArray(x)&&n>0){f(x,n-1);}else{r.push(x);}});})(this,d);return r;};}'
                  'if(!Array.prototype.includes){Array.prototype.includes=function(v){return this.indexOf(v)!==-1;};}</script>')
          if 'Array.prototype.flat' not in s:
              if '</head>' in s:
                  s = s.replace('</head>', poly + '</head>', 1)
              else:
                  s = poly + s
              open(p, 'w', encoding='utf-8').write(s)
              print('polyfill injected ->', p)
          else:
              print('polyfill already present ->', p)
          PY

      - name: Inject Aliyun API keys
        env:
          ALI_AK: ${{ secrets.ALI_AK }}
          ALI_SK: ${{ secrets.ALI_SK }}
        run: |
          sed -i "s/__ALI_AK__/${ALI_AK}/g" www/index.html
          sed -i "s/__ALI_SK__/${ALI_SK}/g" www/index.html
          if grep -q '__ALI_SK__' www/index.html; then echo 'WARN: key not injected (secret missing?)'; fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publish APK into repo
        run: |
          mkdir -p apk
          cp android/app/build/outputs/apk/debug/app-debug.apk apk/shengshengyueer.apk
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add apk/shengshengyueer.apk
          git commit -m "Publish APK [skip ci]" || echo "nothing to commit"
          git push || echo "push skipped"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: shengshengyueer-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
